<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه هوشمند تشخیص کلاهبرداری</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    font-family: Tahoma, sans-serif; 
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh; 
    padding: 40px 20px; 
    display: flex;
    align-items: center;
    justify-content: center;
}
.container { 
    background: white; 
    max-width: 750px; 
    width: 100%;
    padding: 50px; 
    border-radius: 25px; 
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
}
.header { text-align: center; margin-bottom: 40px; }
.header h1 { color: #1e3c72; font-size: 30px; margin-bottom: 10px; }
.header p { color: #666; font-size: 15px; }
.search-box { display: flex; gap: 10px; margin-bottom: 30px; }
.search-box input { 
    flex: 1;
    padding: 18px 22px; 
    border: 2px solid #e0e0e0; 
    border-radius: 15px; 
    font-size: 16px;
    direction: ltr;
    font-family: Tahoma;
}
.search-box input:focus { outline: none; border-color: #1e3c72; }
.search-box button { 
    padding: 18px 40px; 
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white; 
    border: none; 
    border-radius: 15px; 
    cursor: pointer; 
    font-size: 16px; 
    font-weight: bold;
    font-family: Tahoma;
}
.search-box button:hover { transform: translateY(-2px); }
.result { 
    margin-top: 20px; 
    padding: 25px; 
    border-radius: 18px; 
    font-size: 22px; 
    font-weight: bold; 
    text-align: center;
}
.safe { background: #d4edda; color: #155724; border-right: 6px solid #28a745; }
.danger { background: #f8d7da; color: #721c24; border-right: 6px solid #dc3545; }
.details { 
    margin-top: 25px; 
    padding: 25px; 
    background: #f8f9fa; 
    border-radius: 15px; 
    text-align: right;
    border-right: 4px solid #1e3c72;
}
.details h3 { color: #1e3c72; margin-bottom: 15px; font-size: 18px; }
.details ul { list-style: none; line-height: 2.2; font-size: 15px; }
.score-box {
    background: white;
    padding: 15px 20px;
    border-radius: 12px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.score-label { color: #666; font-size: 14px; }
.score-value { color: #1e3c72; font-size: 22px; font-weight: bold; }
.ok { color: #28a745; font-weight: bold; }
.warn { color: #dc3545; font-weight: bold; }
.scale-guide {
    margin-top: 30px;
    padding: 20px;
    background: #f8f9fa;
    border-radius: 15px;
    text-align: right;
    border-right: 4px solid #1e3c72;
}
.scale-guide h3 { color: #1e3c72; margin-bottom: 15px; font-size: 16px; }
.scale-item { padding: 8px 0; font-size: 14px; color: #333; display: flex; align-items: center; gap: 10px; }
.dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
.green { background: #28a745; }
.light-green { background: #92d050; }
.yellow { background: #ffc107; }
.orange { background: #fd7e14; }
.red { background: #dc3545; }

@media (max-width: 768px) {
    body { padding: 15px 10px; }
    .container { padding: 25px 18px; border-radius: 18px; }
    .header { margin-bottom: 25px; }
    .header h1 { font-size: 20px; line-height: 1.4; }
    .header p { font-size: 12px; }
    .search-box { flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .search-box input { width: 100%; padding: 14px 16px; font-size: 14px; }
    .search-box button { width: 100%; padding: 14px; font-size: 15px; }
    .result { font-size: 16px; padding: 16px; margin-top: 15px; }
    .details { padding: 16px; margin-top: 18px; }
    .details h3 { font-size: 14px; margin-bottom: 10px; }
    .details ul { font-size: 12px; line-height: 1.9; }
    .score-box { padding: 12px 14px; }
    .score-label { font-size: 12px; }
    .score-value { font-size: 18px; }
    .scale-guide { padding: 14px; margin-top: 20px; }
    .scale-guide h3 { font-size: 14px; margin-bottom: 10px; }
    .scale-item { font-size: 11px; padding: 5px 0; gap: 7px; }
    .dot { width: 11px; height: 11px; }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔍 سامانه هوشمند تشخیص کلاهبرداری</h1>
        <p>لینک سایت مورد نظر را وارد کنید تا تحلیل شود</p>
    </div>
    <form method="POST">
        <div class="search-box">
            <input type="text" name="url" placeholder="https://example.com" required>
            <button type="submit">تحلیل کن</button>
        </div>
    </form>
    {{ result|safe }}
    
    <div class="scale-guide">
        <h3>📊 راهنمای امتیاز ریسک:</h3>
        <div class="scale-item"><span class="dot green"></span> <b>۰ - ۲۰٪:</b> کاملاً ایمن ✅</div>
        <div class="scale-item"><span class="dot light-green"></span> <b>۲۰ - ۴۰٪:</b> احتمالاً ایمن</div>
        <div class="scale-item"><span class="dot yellow"></span> <b>۴۰ - ۶۰٪:</b> مشکوک ⚠️</div>
        <div class="scale-item"><span class="dot orange"></span> <b>۶۰ - ۸۰٪:</b> خطرناک</div>
        <div class="scale-item"><span class="dot red"></span> <b>۸۰ - ۱۰۰٪:</b> کاملاً خطرناک ❌</div>
    </div>
</div>
</body>
</html>
